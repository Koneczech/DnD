name: Testy DM Hubu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    name: Testy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - name: Node.js podle .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Shoda .nvmrc a engines (a běžící verze)
        run: node skripty/check-node.js --runtime

      - name: Konce řádků v repu jsou LF
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $crlf = git ls-files --eol | Select-String -Pattern 'i/crlf'
          if ($crlf) { Write-Error "Soubory s CRLF v indexu:`n$crlf"; exit 1 }
          Write-Host "Konce řádků v indexu jsou v pořádku."

      - name: Instalace závislostí
        run: npm ci

      - name: Testy
        shell: bash
        run: npm test 2>&1 | tee vystup-testu.txt; exit ${PIPESTATUS[0]}

      # Selhané testy jako anotace: jsou vidět přímo v PR i přes API, bez stahování logu.
      - name: Selhané testy jako anotace
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          { grep -E -A 25 '^\s*not ok' vystup-testu.txt | head -80 || true; echo '--- konec výstupu ---'; tail -n 25 vystup-testu.txt; } > anotace.txt
          zprava=$(sed 's/%/%25/g' anotace.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Testy (${{ runner.os }})::${zprava}"

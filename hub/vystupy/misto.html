<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>DM Hub — místo</title>
  <style>
    /* Scéna místa pro OBS (Blok 2). Browser Source 1920 × 1080 přes celé plátno.
       Ovládá ji panel (Místa a ilustrace): ilustrace, den/noc, stav, počasí, intenzita.
       Všechny přechody se prolínají za 1 s; skryté ilustrace sem server vůbec neposílá. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #obraz, .vrstva, #nalada, #vineta, #pocasi, .mlha { position: absolute; inset: 0; }
    /* Pořadí vrstev: obraz < mlha < déšť/sníh < ztmavení < vinětace. Obraz má vlastní kontext skládání,
       jinak by z-index jeho dvou prolínaných vrstev přebil všechno ostatní a počasí by nebylo vidět. */
    #obraz { z-index: 0; isolation: isolate; }
    .mlha { z-index: 1; }
    #pocasi { z-index: 2; }
    #nalada { z-index: 3; }
    #vineta { z-index: 4; }
    .vrstva { background-size: cover; background-position: center; opacity: 0; }
    #nalada { background: #14121a; opacity: 0; transition: opacity 1.2s ease-in-out; pointer-events: none; }
    #vineta {
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 100%);
      opacity: 0; transition: opacity 1.2s ease-in-out; pointer-events: none;
    }
    #pocasi { opacity: 0; transition: opacity 1.2s ease-in-out; pointer-events: none; }
    .mlha {
      inset: -20% -30%;
      opacity: 0; transition: opacity 1.5s ease-in-out; pointer-events: none;
      background:
        radial-gradient(ellipse 40% 25% at 20% 70%, rgba(205,210,215,0.55), transparent 70%),
        radial-gradient(ellipse 35% 20% at 60% 80%, rgba(205,210,215,0.45), transparent 70%),
        radial-gradient(ellipse 45% 22% at 85% 60%, rgba(205,210,215,0.40), transparent 70%),
        radial-gradient(ellipse 50% 30% at 40% 95%, rgba(215,218,222,0.55), transparent 70%);
      will-change: transform;
    }
    .mlha.m1 { animation: mlha1 60s linear infinite alternate; }
    .mlha.m2 { animation: mlha2 85s linear infinite alternate; transform: scaleX(-1); }
    @keyframes mlha1 { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
    @keyframes mlha2 { from { transform: scaleX(-1) translateX(-10%); } to { transform: scaleX(-1) translateX(10%); } }
  </style>
</head>
<body>
  <div id="obraz"></div>
  <div class="mlha m1"></div>
  <div class="mlha m2"></div>
  <canvas id="pocasi"></canvas>
  <div id="nalada"></div>
  <div id="vineta"></div>
  <script type="module">
    import { sledovat, Prolinac, predNacist } from '/sdilene/vystup.js';

    const obraz = document.getElementById('obraz');
    const prolinac = new Prolinac(obraz, { trvaniMs: 1000 });

    /* Intenzita: 0 nic, 1–3 ztmavení a vinětace (rozhodnutí 38). Záměrně jen průhledné vrstvy,
       bez CSS filtru, protože v prohlížeči OBS dokáže filtr na vrstvě s obrázky vykreslit černou. */
    const NALADA = [
      { tma: 0, vineta: 0 },
      { tma: 0.2, vineta: 0.45 },
      { tma: 0.35, vineta: 0.75 },
      { tma: 0.5, vineta: 1 },
    ];

    /* ---------- Počasí: déšť a sníh na canvasu, mlha v CSS ---------- */
    const platno = document.getElementById('pocasi');
    const ctx = platno.getContext('2d');
    let castice = [];
    let druh = 'zadne';
    let animace = null;
    let posledni = 0;

    function velikost() {
      platno.width = window.innerWidth;
      platno.height = window.innerHeight;
    }
    window.addEventListener('resize', velikost);
    velikost();

    function vytvor(d, s) {
      const W = platno.width, H = platno.height;
      const pocet = d === 'dest' ? 260 + s * 150 : 140 + s * 80;
      castice = Array.from({ length: pocet }, () => nova(d, W, H, true));
    }
    function nova(d, W, H, kdekoli) {
      if (d === 'dest') {
        const z = Math.random();
        return { x: Math.random() * W * 1.2, y: kdekoli ? Math.random() * H : -40, v: 1100 + z * 900, d: 14 + z * 22, a: 0.18 + z * 0.3 };
      }
      const z = Math.random();
      return { x: Math.random() * W, y: kdekoli ? Math.random() * H : -10, v: 40 + z * 70, r: 1 + z * 2.6, f: Math.random() * Math.PI * 2, a: 0.45 + z * 0.45 };
    }

    function krok(t) {
      const dt = Math.min(0.05, (t - posledni) / 1000 || 0);
      posledni = t;
      const W = platno.width, H = platno.height;
      ctx.clearRect(0, 0, W, H);
      if (druh === 'dest') {
        ctx.strokeStyle = 'rgba(200,210,225,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        const vitr = 0.22;
        for (const c of castice) {
          c.y += c.v * dt;
          c.x -= c.v * vitr * dt;
          if (c.y > H + 40 || c.x < -40) Object.assign(c, nova('dest', W, H, false));
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(c.x + c.d * vitr, c.y - c.d);
        }
        ctx.stroke();
      } else if (druh === 'snih') {
        ctx.fillStyle = 'rgba(240,244,250,0.8)';
        ctx.beginPath();
        for (const c of castice) {
          c.y += c.v * dt;
          c.f += dt * 0.8;
          c.x += Math.sin(c.f) * 18 * dt;
          if (c.y > H + 10) Object.assign(c, nova('snih', W, H, false));
          ctx.moveTo(c.x + c.r, c.y);
          ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        }
        ctx.fill();
      }
      animace = requestAnimationFrame(krok);
    }

    let zmenaPocasi = 0;
    const cilPocet = (d, s) => (d === 'dest' ? 260 + s * 150 : 140 + s * 80);

    function spustit() {
      if (animace) return;
      posledni = performance.now();
      animace = requestAnimationFrame(krok);
    }
    function zastavitPozdeji(token) {
      // Doběhni prolnutí, pak animaci zastav (šetří výkon v OBS).
      setTimeout(() => {
        if (token !== zmenaPocasi || !animace) return;
        cancelAnimationFrame(animace);
        animace = null;
        druh = 'zadne';
        ctx.clearRect(0, 0, platno.width, platno.height);
      }, 1300);
    }

    function nastavPocasi(d, s) {
      const token = ++zmenaPocasi;
      document.querySelectorAll('.mlha').forEach((m) => (m.style.opacity = d === 'mlha' ? String(0.55 + s * 0.15) : '0'));
      const canvasove = d === 'dest' || d === 'snih';
      if (!canvasove) {
        platno.style.opacity = '0';
        zastavitPozdeji(token);
        return;
      }
      if (animace && druh === d) {
        // Jen jiná síla: doplň nebo uber částice, ať déšť neposkočí.
        const cil = cilPocet(d, s);
        while (castice.length < cil) castice.push(nova(d, platno.width, platno.height, true));
        castice.length = cil;
        platno.style.opacity = '1';
        return;
      }
      if (animace && druh !== 'zadne') {
        // Déšť ↔ sníh: nejdřív staré počasí rozplyň, pak nastup s novým.
        platno.style.opacity = '0';
        setTimeout(() => {
          if (token !== zmenaPocasi) return;
          druh = d;
          vytvor(d, s);
          platno.style.opacity = '1';
        }, 1250);
        return;
      }
      druh = d;
      vytvor(d, s);
      spustit();
      platno.style.opacity = '1';
    }

    /* Diagnostika: adresa s ?ladeni vypíše do rohu poslední stav a chyby načtení obrázku. */
    const ladeni = new URLSearchParams(location.search).has('ladeni');
    let ladiciText = '';
    const ladici = document.createElement('pre');
    ladici.style.cssText = 'position:absolute;left:12px;bottom:12px;margin:0;padding:8px 10px;max-width:70%;white-space:pre-wrap;font:14px/1.3 monospace;color:#fff;background:rgba(0,0,0,.7);z-index:99';
    if (ladeni) document.body.append(ladici);
    function zapsat(radek) {
      if (!ladeni) return;
      ladiciText = (radek + '\n' + ladiciText).split('\n').slice(0, 8).join('\n');
      ladici.textContent = ladiciText;
    }
    prolinac.priChybe = (url) => zapsat('CHYBA načtení: ' + url);

    function prevzit(s) {
      if (!s) return;
      zapsat(new Date().toLocaleTimeString('cs') + ' ' + (s.ilustrace ? s.ilustrace.url : '(bez ilustrace)') + ' | ' + s.pocasi + ' ' + s.intenzita);
      prolinac.ukazat(s.ilustrace ? s.ilustrace.url : null);
      if (s.dalsi) predNacist(s.dalsi);
      const n = NALADA[s.intenzita] ?? NALADA[0];
      document.getElementById('nalada').style.opacity = String(n.tma);
      document.getElementById('vineta').style.opacity = String(n.vineta);
      nastavPocasi(s.pocasi, s.intenzita);
    }

    sledovat('scena', '/api/scena', prevzit);
  </script>
</body>
</html>

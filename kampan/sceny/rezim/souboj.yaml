# Souboj: rudé hlavní světlo (Hub ho kvůli čtení deníků zesvětlí) a oheň v lampě.
svetla:
  hlavni: { barva: [255, 90, 60], jas: 45 }
  lampa: { wiz_scena: fireplace, rychlost: 80 }
obs_role: souboj
# Hudba: playlist. Původní souboj.mp3 a všechny skladby ve složce hudba/souboj/ v náhodném pořadí,
# takže ani hodinový souboj nehraje pořád dokola jednu písničku (DM 19. 10. 2026).
# Konec souboje: místo fanfáry jeden úder bubnu v dozvuku jeskyně a bojová hudba pod ním za 6 s dozní.
# Tlačítko Konec potichu buben vynechá (útěk, prohra). konec/buben = varianty buben-1, buben-2 …
zvuk:
  # Spotify (DM 20. 10. 2026): playlist „DM Hub Souboj D&D“ (styl Zaklínač, Král Artuš, Peaky Blinders); záloha ze složky, když Spotify nejede.
  hudba: { spotify: spotify:playlist:0cBHwxr15oCWygLqQ64Bpk, zaloha: [souboj.mp3, hudba/souboj/] }
  konec: { zvuk: konec/buben, dozvuk: jeskyne, prolnuti_s: 6 }

# Zvuková sada (ZADANI.md, otevřené body 86–88): jaké zvuky má mít složka zvuku a odkud je Hub vezme
# (Freesound, Openverse, balíčky Kenney). Soubory do repa nepatří; Hub je stáhne do složky zvuku
# (Nastavení → Zvuk → Doplnit chybějící zvuky) a autory zapíše do zdroje.json ve složce zvuku.
#
# Klíč = cíl ve složce zvuku bez přípony. variant: 1 = jeden soubor (cil.mp3), víc = cil-1.mp3, cil-2.mp3 …
# hledat = anglicky; jeden dotaz, nebo seznam náhradních [první, druhý …]. delka = [od, do] v sekundách.
# Hub hledá na Freesoundu (s klíčem) a v Openverse; nic-li nenajde, zkusí dotaz zkrátit.
# balik: kenney/<balíček> + soubory: [jména v balíčku] = zvuky z balíčku Kenney (CC0); ZIP se stáhne
# jednou do složky zvuku (baliky/) a dál se pracuje lokálně.
# Hlasitost se neřeší: Hub soubory změří a srovná (Nastavení → Zvuk → Srovnání hlasitosti).
schema: 1

zvuky:
  # Souboj: konec a poplach
  vitezstvi: { hledat: medieval fanfare trumpet, delka: [3, 15], popis: Vítězná fanfára (Konec souboje) }
  smycky/poplasny-zvon: { hledat: bell ringing alarm, delka: [8, 60], popis: Poplašný zvon (soundboard, sám skončí po 20 s) }

  # Zvuky na tah (kampan/zvuky.yaml): krátké, Hub je po 2,5 s ztlumí
  tahy/tusker: { hledat: [war drum hit, tribal drum hit, big drum hit, taiko drum], delka: [0.3, 3], popis: Tusker }
  tahy/koudur: { hledat: [lute strum, lute, harp strum, acoustic guitar strum], delka: [0.5, 4], popis: Koudur }
  tahy/leta: { hledat: dagger unsheathe, delka: [0.3, 3], popis: Leta }
  tahy/alba: { hledat: [magic nature chime, wind chimes, magic sparkle, chimes], delka: [0.5, 4], popis: Alba }
  tahy/malk: { hledat: sword unsheathe, delka: [0.3, 3], popis: Malk Orren }
  tahy/nepritel: { hledat: deep drum impact, delka: [0.3, 3], popis: Společný zvuk nepřátel }
  tahy/srdce: { hledat: heartbeat, delka: [1, 4], popis: Tlukot srdce (tag Unconscious, zatím nezapojený) }

  # Tábor lupičů mimo boj: ambient a náhodné zvuky
  tabor-ohen: { hledat: [campfire crackling, campfire, fire crackling], delka: [60, 600], popis: Ambient tábora (oheň) }
  nahodne/tabor/kun: { hledat: horse whinny, delka: [1, 6], variant: 3, popis: Kůň }
  nahodne/tabor/kovadlina: { hledat: anvil hammer strike, delka: [0.5, 5], variant: 3, popis: Kovadlina }
  nahodne/tabor/krkavec: { hledat: raven call, delka: [0.5, 4], variant: 3, popis: Krkavec }
  nahodne/tabor/drevo: { hledat: wood chopping axe, delka: [0.5, 4], variant: 3, popis: Sekání dřeva }
  smycky/tabor/hori: { hledat: large fire burning, delka: [20, 300], popis: Požár (stav Hoří, soundboard) }

  # Tábor lupičů v souboji: ambient a náhodné zvuky
  tabor-bitva: { hledat: [medieval battle ambience, battle ambience, sword battle crowd, war battle], delka: [30, 600], popis: Ambient bitvy }
  nahodne/boj/rinceni: { hledat: sword clash, delka: [0.3, 3], variant: 4, popis: Řinčení zbraní }
  nahodne/boj/sip: { hledat: arrow whoosh impact, delka: [0.3, 3], variant: 3, popis: Šípy }
  nahodne/boj/pokrik: { hledat: [war cry shout, battle cry, war cry, warrior shout, man yelling], delka: [0.5, 3], variant: 3, popis: Válečný pokřik }

  # Soundboard
  jednorazove/boj/mec: { hledat: sword hit, delka: [0.2, 2], variant: 3, popis: Úder mečem }
  jednorazove/boj/stit: { balik: kenney/impact-sounds, soubory: [impactPlank_medium_000, impactPlank_medium_001, impactWood_heavy_000], popis: Rána do dřevěného štítu }
  jednorazove/zvirata/vlk-vroceni: { hledat: wolf growl, delka: [1, 5], variant: 2, popis: Vrčení vlka (Alba) }
  jednorazove/zvirata/medved-rev: { hledat: bear roar, delka: [1, 5], variant: 2, popis: Řev medvěda (Alba) }

  # Soundboard z balíčků Kenney (CC0): dveře, předměty, boj
  jednorazove/predmety/dvere-otevrit: { balik: kenney/rpg-audio, soubory: [doorOpen_1, doorOpen_2], popis: Otevření dveří }
  jednorazove/predmety/dvere-zavrit: { balik: kenney/rpg-audio, soubory: [doorClose_1, doorClose_2, doorClose_3], popis: Zavření dveří }
  jednorazove/predmety/vrzani: { balik: kenney/rpg-audio, soubory: [creak1, creak2, creak3], popis: Vrzání (dveře, podlaha) }
  jednorazove/predmety/mince: { balik: kenney/rpg-audio, soubory: [handleCoins, handleCoins2], popis: Mince }
  jednorazove/predmety/kniha: { balik: kenney/rpg-audio, soubory: [bookFlip1, bookFlip2, bookFlip3], popis: Listování knihou }
  jednorazove/predmety/zamek: { balik: kenney/rpg-audio, soubory: [metalLatch, metalClick], popis: Zámek, západka }
  jednorazove/boj/tasit: { balik: kenney/rpg-audio, soubory: [drawKnife1, drawKnife2, drawKnife3], popis: Tasení čepele }
  jednorazove/boj/rana: { balik: kenney/impact-sounds, soubory: [impactPunch_heavy_000, impactPunch_heavy_001, impactPunch_heavy_002], popis: Rána pěstí }
  jednorazove/boj/zbroj: { balik: kenney/impact-sounds, soubory: [impactMetal_heavy_000, impactMetal_heavy_001, impactMetal_heavy_002], popis: Zásah do kovové zbroje }

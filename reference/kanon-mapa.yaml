# Mapa převodu kánonu (Blok 3). Každá položka ze zdrojů kánonu má tady své id, typ a cíl v repu.
# Postup a pravidla jsou v reference/kanon-prevod.md, zjištění auditu v reference/kanon-audit.md.
#
# Tuhle mapu čte nástroj `npm run kanon` (hub/nastroje/kanon.js): u každé skupiny porovná počet
# položek ve zdroji se soubory v kampan/, ukáže chybějící a navíc, soubory bez `zdroj` a hlášení
# z Kontroly dat. Mapa se mění jen tehdy, když DM rozhodne jinak (typ, id, sloučení, vynechání).
#
# akce: prevest  = nový soubor v kampan/
#       sloucit  = obsah se přidá do existujícího souboru (pole `do`)
#       vynechat = nepřevádí se; `proc` vysvětlí rozdíl v počtu
#       doplnit  = kánon mimo Notion (chat, paměť); soubor vznikne, až DM potvrdí text
#       ponechat = soubor už v repu je a s Notionem nesouvisí (místa z Bloku 2, poznámky mimo sezení)
# rozpory: čísla rozporů z reference/kanon-audit.md (R1, R2 …); před převodem je rozhodne DM.
schema: 1
stav_k: 2026-10-19
notion: https://app.notion.com/p/3c39ed2267368185bdc2f02d0b397d7c

# Rozpory, které DM rozhodl. Při převodu se text karet opraví jen podle nich; neplatná věta dostane
# za sebe poznámku v kurzívě, např. „*(Příprava před sezením 2, neplatí: prsten má kapitán lupičů.)*“
rozhodnute_rozpory:
  R1: { kdy: 2026-10-19, rozhodnuti: "Kontaktem v Longsaddle byl Malk Orren. Karta Notionu „Kontakt v Longsaddle“ se převede jako malk-orren (alias Kontakt v Longsaddle) a doplní se z přípravy sezení 2. Rozhodnutí „Jméno a řemeslo kontaktu“ je rozhodnuté. Heslo „úplně poslední zakázka z Mirabaru“ platí (Thiril ho Letě dal ve vězení, hráčka ho zná); Leta ho Malkovi neřekla." }
  R2: { kdy: 2026-10-19, rozhodnuti: "Torva je NPC i padouch, stejně jako Bifron a Grimsdal: typ padouch, složka padouchove/. Na začátek karty: V sezení 1 zemřela." }
  R3: { kdy: 2026-10-19, rozhodnuti: "Thirilův prsten má na prstu kapitán lupičů (v sezení 3). Věty, že ho drží Ordwin nebo že je v obálce s dopisem, dostanou poznámku: příprava před sezením 2, neplatí." }
  R11: { kdy: 2026-10-19, rozhodnuti: "Bifronova další zastávka po Lurkwoodu je Neverwinterský hvozd (na západ). Ve Stopě do Yartaru se „Moonwood, na východ“ opraví na Neverwinterský hvozd, na západ. Pořadí sázení v kartě Bifrona: Glimmerwood → Lurkwood → Neverwinterský hvozd → High Forest (DM 19. 10.). Moonwood a Glimmerwood jsou v kampani jeden les a jmenuje se Glimmerwood (tak ho zná hráčka); Moonwood je alias." }

  R4: { kdy: 2026-10-19, rozhodnuti: "Nováček kruhu je skupina NPC se statblokem, ne jedna postava. Popis sedmnáctiletého kluka, který mluví víc, než by měl, patří Tavisovi: přesune se do karty tavis a karta Nováček kruhu ho ztratí. Tavis: V sezení 1 ho zabila Leta. V zápisu sezení 1 se „ukecaný hlídač“ ve scéně 6 opraví na „nováček“." }
  R5: { kdy: 2026-10-19, rozhodnuti: "Pozvánku pro Koudura předá Hedwiga na scéně v den pilotu 12. Eleintu. U Koudura (kap. 7) a U Kamenné mísy poznámka, že věta o pozvánce před dvěma, třemi dny neplatí." }
  R6: { kdy: 2026-10-19, rozhodnuti: "V Ordwinově dopise „čtrnáct let“ → „osmnáct let“." }
  R7: { kdy: 2026-10-19, rozhodnuti: "Ordwin u sázky v U Roztaveného groše nebyl, dozvěděl se o ní až potom. V kartě hospody poznámka u „spolu s Ordwinem“ a „Ordwinovi se to nelíbilo od začátku“." }
  R8: { kdy: 2026-10-19, rozhodnuti: "Longsaddle leží jižně od Mirabaru." }
  R9: { kdy: 2026-10-19, rozhodnuti: "Jazyky postav platí podle listu postavy. Vlastnost Languages z Notionu se nepřevádí." }
  R10: { kdy: 2026-10-19, rozhodnuti: "Ordwinův dopis je svitek, ne obálka. Adresát je označený Letiným symbolem (L se šípem), ne jménem. Otevřená otázka „jméno na obálce“ se zavře." }
  R12: { kdy: 2026-10-19, rozhodnuti: "Corvain poslal Albu podle zápisků do Lurkwoodu; otec má být mezi Glimmerwoodem a Lurkwoodem (jak má hráčka). V kartě Corvaina poznámka u „trasa mezi Mirabarem a Lurkwoodem“." }
  R13: { kdy: 2026-10-19, rozhodnuti: "Tábor kruhu je samostatné místo s vazbou na Lurkwood. Ilustrace tábora zůstanou v mista/lurkwood." }
  R14: { kdy: 2026-10-19, rozhodnuti: "První řádek karty Bifrona: „Člověk, Albin otec. Druid, radikalizovaný ochránce přírody.“ Překlep „obykčejná“ v rozhodnutí se opraví." }
  R15: { kdy: 2026-10-19, rozhodnuti: "Druhý zajatec, cesta do Lurkwoodu, jak se Leta dozví o Thirilově smrti a co Longsaddle vydá se převedou jako rozhodnuto; do Dopadu odkaz na sezení, které je rozhodlo." }
  R16: { kdy: 2026-10-19, rozhodnuti: "Oddíly „Dnes“, „Současný stav“ a „Teď“ dostanou nadpis Výchozí stav (před sezením 1), text zůstane." }


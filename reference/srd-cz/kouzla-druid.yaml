- id: produce-flame
  nazev: Stvoř plamen
  en: Produce Flame
  uroven: 0
  skola: Vyvolávací trik
  seslani: bonusová akce
  dosah: na sebe
  slozky: VP
  surovina: ''
  trvani: 10 minut
  popis: V ruce se ti objeví mihotavý plamen a zůstane tam po dobu trvání. Plamen nehřeje a nic nezapálí, vydává jasné světlo v okruhu 20 stop a tlumené světlo dalších 20 stop. Kouzlo skončí, když ho sešleš znovu. Dokud kouzlo trvá, můžeš magickou akcí hodit oheň na bytost nebo předmět do 60 stop od sebe. Proveď útok kouzlem na dálku. Při zásahu utrpí cíl 1k8 ohnivého zranění.
  vyssi: Zranění se zvýší o 1k8, když dosáhneš 5. úrovně (2k8), 11. úrovně (3k8) a 17. úrovně (4k8).
  vlastni_nazev: false
  na_listu: false
  vzdy: false
  zdroj_listu: ''
- id: shillelagh
  nazev: Sukovice
  en: Shillelagh
  uroven: 0
  skola: Transmutační trik
  seslani: bonusová akce
  dosah: na sebe
  slozky: VPS
  surovina: jmelí
  trvani: 1 minuta
  popis: Kyj nebo dlouhá hůl, kterou držíš, se naplní silou přírody. Po dobu trvání můžeš pro hody na útok a na zranění útoky na blízko touto zbraní použít svou sesílací vlastnost místo Síly a kostka zranění zbraně se změní na k8. Když útok způsobí zranění, může být silové, nebo běžného druhu zbraně (podle tvé volby). Kouzlo předčasně skončí, když ho sešleš znovu nebo když zbraň pustíš.
  vyssi: Kostka zranění se změní, když dosáhneš 5. úrovně (k10), 11. úrovně (k12) a 17. úrovně (2k6).
  vlastni_nazev: false
  na_listu: false
  vzdy: false

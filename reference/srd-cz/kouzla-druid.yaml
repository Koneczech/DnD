schema: 1
kouzla:
- id: druidcraft
  nazev: Druidství
  en: Druidcraft
  uroven: 0
  skola: Transmutační trik
  seslani: akce
  dosah: 30 stop
  slozky: VP
  surovina: ''
  trvani: okamžité
  popis: |-
    Šeptáš duchům přírody a v dosahu vytvoříš jeden z těchto účinků.

    - ***Předpověď počasí.*** Vytvoříš drobný neškodný smyslový úkaz, který předpoví počasí na tvém místě na příštích 24 hodin. Může se projevit jako zlatá koule pro jasnou oblohu, mráček pro déšť, padající vločky pro sníh a podobně. Úkaz trvá 1 kolo.
    - ***Rozkvět.*** Okamžitě necháš rozkvést květ, otevřít lusk se semeny nebo rozvinout poupě listu.
    - ***Smyslový úkaz.*** Vytvoříš neškodný smyslový úkaz, třeba padající listí, tančící přízračné víly, jemný vánek, zvuk zvířete nebo slabý pach skunka. Úkaz se musí vejít do krychle o hraně 5 stop.
    - ***Hra s ohněm.*** Zapálíš nebo uhasíš svíčku, pochodeň nebo táborák.
  vyssi: ''
  vlastni_nazev: false
  na_listu: true
  vzdy: false
  zdroj_listu: Druid cantrip
- id: starry-wisp
  nazev: Hvězdná bludička
  en: Starry Wisp
  uroven: 0
  skola: Zaklínací trik
  seslani: akce
  dosah: 60 stop
  slozky: VP
  surovina: ''
  trvani: okamžité
  popis: Vystřelíš zrnko světla na jednu bytost nebo předmět v dosahu. Proveď útok kouzlem na dálku proti cíli. Při zásahu utrpí cíl 1k8 zářivého zranění a do konce tvého příštího tahu vydává tlumené světlo v okruhu 10 stop a nemůže těžit ze stavu neviditelný.
  vyssi: Zranění se zvýší o 1k8, když dosáhneš 5. úrovně (2k8), 11. úrovně (3k8) a 17. úrovně (4k8).
  vlastni_nazev: false
  na_listu: true
  vzdy: true
  zdroj_listu: Always prepared
- id: poison-spray
  nazev: Jedovatá sprška
  en: Poison Spray
  uroven: 0
  skola: Nekromantický trik
  seslani: akce
  dosah: 30 stop
  slozky: VP
  surovina: ''
  trvani: okamžité
  popis: Vystříkneš jedovatou mlhu na bytost v dosahu. Proveď útok kouzlem na dálku proti cíli. Při zásahu utrpí cíl 1k12 jedového zranění.
  vyssi: Zranění se zvýší o 1k12, když dosáhneš 5. úrovně (2k12), 11. úrovně (3k12) a 17. úrovně (4k12).

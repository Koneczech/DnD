- id: mending
  nazev: Oprava
  en: Mending
  uroven: 0
  skola: Transmutační trik
  seslani: 1 minuta
  dosah: dotyk
  slozky: VPS
  surovina: dva magnetovce
  trvani: okamžité
  popis: Kouzlo opraví jedno prasklé nebo roztržené místo na předmětu, kterého se dotkneš, třeba prasklé očko řetězu, dvě poloviny zlomeného klíče, roztržený plášť nebo děravý měch na víno. Pokud poškození není v žádném rozměru větší než 1 stopa, opravíš ho beze stopy. Kouzlo umí fyzicky opravit kouzelný předmět, ale nevrátí mu magii.
  vyssi: ''
  vlastni_nazev: false
  na_listu: true
  vzdy: false
  zdroj_listu: Magic Initiate
- id: elementalism
  nazev: Ovládání živlů
  en: Elementalism
  uroven: 0
  skola: Transmutační trik
  seslani: akce
  dosah: 30 stop
  slozky: VP
  surovina: ''
  trvani: okamžité
  popis: |-
    Ovládneš živly a v dosahu vytvoříš jeden z těchto účinků.

    ***Přivolání vzduchu.*** Vytvoříš vánek tak silný, že rozvlní látku, zvíří prach, rozšustí listí a zavře otevřené dveře a okenice, to vše v krychli o hraně 5 stop. Dveře a okenice, které někdo nebo něco drží otevřené, ovlivněny nejsou.

    ***Přivolání země.*** Vytvoříš tenký povlak prachu nebo písku na površích v ploše 5 × 5 stop, nebo necháš v hlíně či písku objevit jedno slovo psané tvým rukopisem.

    ***Přivolání ohně.*** V krychli o hraně 5 stop vytvoříš řídký oblak neškodných jisker a barevného vonného kouře. Barvu i vůni si vybereš a jiskry mohou v té oblasti zapálit svíčky, pochodně nebo lampy. Vůně kouře vydrží 1 minutu.

    ***Přivolání vody.*** V krychli o hraně 5 stop vytvoříš spršku chladné mlhy, která lehce zvlhčí bytosti a předměty. Nebo vytvoříš 1 hrnek čisté vody v otevřené nádobě nebo na povrchu; voda se do 1 minuty odpaří.

    ***Tvarování živlu.*** Hlína, písek, oheň, kouř, mlha nebo voda, která se vejde do krychle o hraně 1 stopy, na 1 hodinu získá hrubý tvar (třeba tvar bytosti).
  vyssi: ''
  vlastni_nazev: false
  na_listu: false
  vzdy: false
  zdroj_listu: ''

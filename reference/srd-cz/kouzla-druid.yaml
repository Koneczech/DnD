  popis: |-
    Po dobu trvání kouzlo zvětší nebo zmenší bytost nebo předmět, které vidíš v dosahu (viz zvolený účinek níže). Zaměřený předmět nesmí mít nikdo na sobě ani u sebe. Pokud je cílem bytost, která nechce, může si hodit záchranu na Odolnost. Při úspěchu kouzlo nemá účinek. Vše, co zaměřená bytost má na sobě a nese, změní velikost s ní. Každá věc, kterou upustí, se okamžitě vrátí do normální velikosti. Vrhací zbraň nebo střelivo se vrátí do normální velikosti hned poté, co cíl zasáhne nebo mine.

    ***Zvětšení.*** Velikost cíle se zvýší o jeden stupeň, například ze střední na velkou. Cíl má také výhodu na ověření Síly a záchrany na Sílu. Útoky cíle zvětšenými zbraněmi nebo útoky beze zbraně způsobí při zásahu o 1k4 zranění navíc.

    ***Zmenšení.*** Velikost cíle se sníží o jeden stupeň, například ze střední na malou. Cíl má také nevýhodu na ověření Síly a záchrany na Sílu. Útoky cíle zmenšenými zbraněmi nebo útoky beze zbraně způsobí při zásahu o 1k4 zranění méně (zranění ale neklesne pod 1).

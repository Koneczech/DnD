- id: thunderwave
  nazev: Hromová vlna
  en: Thunderwave
  uroven: 1
  skola: Zaklínání, 1. úroveň
  seslani: akce
  dosah: na sebe
  slozky: VP
  surovina: ''
  trvani: okamžité
  popis: |-
    Vypustíš vlnu hromové energie. Každá bytost v krychli o hraně 15 stop vycházející z tebe si hází záchranu na Odolnost. Při neúspěchu utrpí 2k8 hromového zranění a je odhozena o 10 stop od tebe. Při úspěchu utrpí jen poloviční zranění.

    Navíc nepřipevněné předměty, které jsou celé v krychli, jsou odhozeny o 10 stop od tebe a hromový třesk je slyšet do 300 stop.
  vyssi: Zranění se zvýší o 1k8 za každou úroveň pozice kouzla nad 1.
